.pieza.visible:hover { border-color: color-mix(in srgb, var(--t-accent) 40%, var(--t-border)); }

/* ---------- Documentación ---------- */
.docs { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; padding-top: 32px; padding-bottom: 80px; }
.lateral { position: sticky; top: 88px; align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; padding-right: 8px; scrollbar-width: thin; }
.lat-grupo { margin: 22px 0 6px; padding-left: 12px; color: var(--t-text-3); font: 650 11.5px/1 var(--t-font); letter-spacing: .08em; text-transform: uppercase; }
.lat-grupo:first-child { margin-top: 0; }
.lat-link {
  position: relative;
  display: block;
  padding: 7px 12px;
  border-radius: 8px;
  color: var(--t-text-2);
  font-size: 14px;
  text-decoration: none;
  transition: color var(--t-fast), background var(--t-fast), padding var(--t-med) var(--t-ease);
}
.lat-link:hover { color: var(--t-text); background: var(--t-surface-2); }
.lat-link.on { color: var(--t-accent-text); background: var(--t-accent-soft); font-weight: 600; padding-left: 16px; }
.lat-link.on::before { content: ""; position: absolute; left: 6px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--t-accent); animation: crecer-v var(--t-slow) var(--t-ease); }

.pagina { min-width: 0; max-width: 860px; animation: entrar .5s var(--t-ease) backwards; }
.miga { margin: 0 0 8px; color: var(--t-accent-text); font: 600 13px/1 var(--t-font); }
.pag-cab h1 { margin: 0; font: 740 clamp(32px, 4vw, 44px)/1.1 var(--t-font); letter-spacing: -.035em; }
.pag-desc { margin: 14px 0 0; max-width: 640px; color: var(--t-text-2); font-size: 17px; }
.pag-cab .t-btn { margin-top: 20px; }
.pag-h2 { margin: 48px 0 14px; font: 680 21px/1.3 var(--t-font); letter-spacing: -.02em; }
.pag-p { margin: 14px 0 10px; color: var(--t-text-2); }
.pagina > .t-alert { margin-top: 18px; }

/* ---------- Ejemplo vivo y código ---------- */
.ej { border: 1px solid var(--t-border); border-radius: var(--t-radius-lg); overflow: hidden; background: var(--t-surface); box-shadow: var(--t-shadow-sm); }
.ej-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 170px;
  padding: 40px 28px;
  background: radial-gradient(color-mix(in srgb, var(--t-text) 8%, transparent) 1px, transparent 1px) 0 0 / 16px 16px, var(--t-surface);
}
.ej-lienzo { width: 100%; max-width: 680px; animation: aparecer .45s var(--t-ease) backwards; }
.demo-error { padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--t-danger) 10%, transparent); color: var(--t-danger); font: 13px/1.5 var(--t-mono); white-space: pre-wrap; }
.ej-code, .codigo { background: #17140f; color: #ece6dc; }
.codigo { margin: 10px 0; border-radius: var(--t-radius-lg); overflow: hidden; border: 1px solid #2a251e; }
.ej-bar, .codigo-cab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 10px 8px 12px;
  border-bottom: 1px solid #2a251e;
}
.codigo-len { color: #9d958a; font: 600 12px/1 var(--t-font); letter-spacing: .02em; }
.ej-tabs { display: flex; gap: 2px; }
.ej-tab, .ej-btn {
  height: 30px;
  padding: 0 11px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #9d958a;
  font: 560 12.5px/1 var(--t-font);
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
}
.ej-tab:hover, .ej-btn:hover { background: #26211a; color: #ece6dc; }
.ej-tab.on { background: #2b251d; color: #fff; }
.ej-btn.on { background: var(--t-accent); color: #fff; }
.ej-acciones { display: flex; gap: 4px; }
.comando .ej-btn { color: var(--t-text-2); }
.comando .ej-btn:hover { background: var(--t-surface-2); color: var(--t-text); }
.ej-pre, .ej-editor {
  display: block;
  width: 100%;
  margin: 0;
  max-height: 460px;
  overflow: auto;
  padding: 18px 20px;
  border: 0;
  background: transparent;
  color: #ece6dc;
  font: 13.2px/1.7 var(--t-mono);
  tab-size: 2;
  white-space: pre;
}
.ej-editor { min-height: 340px; resize: vertical; outline: none; caret-color: var(--t-accent); }
.ej-editor:focus { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--t-accent) 50%, transparent); }
.hl-k { color: #ff9a5c; }
.hl-s { color: #b7e29a; }
.hl-c { color: #7d756b; font-style: italic; }
.hl-d { color: #f7c66b; }
.hl-b { color: #7dd3fc; }
.hl-e { color: #d6b4fc; }
.hl-n { color: #f9a8d4; }
.hl-t { color: #ffd29e; }
.hl-f { color: #93c5fd; }

.api { display: flex; flex-direction: column; border: 1px solid var(--t-border); border-radius: var(--t-radius-lg); overflow: hidden; }
.api-fila { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--t-border); background: var(--t-surface); transition: background var(--t-fast); }
.api-fila:last-child { border-bottom: 0; }
.api-fila:hover { background: var(--t-surface-2); }
.api-firma { justify-self: start; padding: 3px 8px; border-radius: 6px; background: var(--t-accent-soft); color: var(--t-accent-text); font: 550 13px/1.5 var(--t-mono); word-break: break-word; }
.api-desc { margin: 0; color: var(--t-text-2); font-size: 14px; }

.pag-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; }
.pag-ant, .pag-sig {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 200px;
  padding: 14px 18px;
  border: 1px solid var(--t-border);
  border-radius: var(--t-radius-lg);
  text-decoration: none;
  transition: border-color var(--t-fast), transform var(--t-med) var(--t-ease), box-shadow var(--t-med);
}
.pag-sig { margin-left: auto; text-align: right; }
.pag-ant span, .pag-sig span { color: var(--t-text-3); font-size: 12.5px; }
.pag-ant:hover, .pag-sig:hover { border-color: color-mix(in srgb, var(--t-accent) 45%, var(--t-border)); transform: translateY(-2px); box-shadow: var(--t-shadow); }

/* ---------- Temas ---------- */
.colores { display: flex; flex-wrap: wrap; gap: 10px; }
.color {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 40px;
  padding: 0 14px 0 10px;
  border: 1px solid var(--t-border);
  border-radius: 999px;
  background: var(--t-surface);
  color: var(--t-text);
  font: 540 14px var(--t-font);
  cursor: pointer;
  transition: border-color var(--t-fast), transform var(--t-med) var(--t-ease-spring), box-shadow var(--t-fast);
}
.color:hover { transform: translateY(-2px); }
.color.on { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.color-punto { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); transition: transform var(--t-med) var(--t-ease-spring); }
.color.on .color-punto { transform: scale(1.15); }
.rango { width: min(360px, 100%); accent-color: var(--t-accent); }

/* ---------- Búsqueda ---------- */
.resultados { display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow: auto; margin: 0 -8px; }
.resultado {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--t-text);
  text-decoration: none;
  animation: aparecer .3s var(--t-ease) backwards;
  transition: background var(--t-fast);
}
.resultado:hover, .resultado:focus-visible { background: var(--t-accent-soft); outline: none; }
.resultado-nombre { font-weight: 600; }
.resultado-grupo { color: var(--t-text-3); font-size: 13px; }
.resultado-vacio { margin: 8px 12px; color: var(--t-text-3); }

/* ---------- Pie ---------- */
.pie { display: flex; justify-content: space-between; gap: 16px; padding-block: 28px 40px; border-top: 1px solid var(--t-border); color: var(--t-text-3); font-size: 13.5px; }
.pie a { color: var(--t-text-2); }

/* ---------- Móvil ---------- */
@media (max-width: 1000px) {
  .hero-in { grid-template-columns: 1fr; }
  .vitrina { min-height: 0; }
  .vitrina-pila { height: auto; display: grid; gap: 16px; }
  .flota { position: relative; inset: auto; width: auto; transform: none; }
  .flota-b, .flota-c { display: none; }
  .rasgos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .top-nav, .buscar-txt, .buscar-kbd { display: none; }
  .buscar { min-width: 0; width: 38px; padding: 0; justify-content: center; }
  .menu-btn { display: inline-grid; }
  .docs { grid-template-columns: 1fr; gap: 0; }
  .lateral {
    position: fixed;
    top: 64px;
    left: 0;
    bottom: 0;
    z-index: 40;
    width: min(280px, 85vw);
    max-height: none;
    padding: 20px 16px;
    background: var(--t-surface);
    border-right: 1px solid var(--t-border);
    box-shadow: var(--t-shadow-lg);
    transform: translateX(-105%);
    transition: transform var(--t-slow) var(--t-ease);
  }
  .lateral.abierto { transform: none; }
}
@media (max-width: 640px) {
  .top-in { padding-inline: 16px; gap: 12px; }
  .hero { padding: 40px 0 56px; }
  .rasgos { grid-template-columns: 1fr; }
  .api-fila { grid-template-columns: 1fr; gap: 6px; }
  .pag-nav { flex-direction: column; }
  .pag-ant, .pag-sig { min-width: 0; }
  .comando { max-width: 100%; overflow-x: auto; }
  .ej-preview { padding: 28px 16px; }
}

/* ---------- Animaciones ---------- */
@keyframes subir { from { opacity: 0; transform: translateY(16px); } }
@keyframes aparecer { from { opacity: 0; transform: translateY(10px) scale(.985); } }
@keyframes entrar { from { opacity: 0; transform: translateY(12px); } }
@keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes derivar { to { transform: translate(-60px, 40px) scale(1.12); } }
@keyframes brillo { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes latir { 0%, 100% { box-shadow: 0 0 0 4px var(--t-accent-soft); } 50% { box-shadow: 0 0 0 7px transparent; } }
@keyframes crecer { from { transform: scaleX(0); } }
@keyframes crecer-v { from { transform: scaleY(0); } }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .revelar { opacity: 1; transform: none; }
}
</style>

<script>
// Lo que la web de Tangerine UI necesita de JavaScript: resaltar código,
// ejecutar los ejemplos en vivo, temas y animaciones al hacer scroll.
(function () {
  "use strict";
  const T = window.Tangerine;
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } };
  const leer = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const raiz = document.documentElement;

  function aplicarRadio(px) {
    const n = Number(px);
    raiz.style.setProperty("--t-radius", n + "px");
    raiz.style.setProperty("--t-radius-sm", Math.max(2, Math.round(n * 0.7)) + "px");
    raiz.style.setProperty("--t-radius-lg", Math.round(n * 1.6) + "px");
  }

  // Tema guardado, antes de dibujar nada (evita el destello)
  const temaGuardado = leer("tui-tema");
  if (temaGuardado) raiz.dataset.theme = temaGuardado;
  const acento = leer("tui-acento");
  if (acento) raiz.style.setProperty("--t-accent", acento);
  const radio = leer("tui-radio");
  if (radio) aplicarRadio(radio);

  // ---------- Resaltado ----------
  const KW = new Set("let var fn return if else while loop for in break continue match class struct self super do catch throw true false nil import export async await from as view".split(" "));
  const TNG = /(\/\/[^\n]*)|("(?:\\.|[^"\\])*")|(@[A-Za-z]+)|(\$[A-Za-z_]\w*)|(\.[a-z][\w-]*(?=[,)\s]))|(\b\d[\d_.]*\b)|([A-Za-z_\u00C0-\u024F][\w\u00C0-\u024F]*)/g;
  function tng(src) {
    const out = [];
    let last = 0, m;
    TNG.lastIndex = 0;
    while ((m = TNG.exec(src))) {
      if (m.index > last) out.push([null, src.slice(last, m.index)]);
      const t = m[0];
      if (m[1]) out.push(["c", t]);
      else if (m[2]) out.push(["s", t]);
      else if (m[3]) out.push(["d", t]);
      else if (m[4]) out.push(["b", t]);
      else if (m[5]) out.push(["e", t]);
      else if (m[6]) out.push(["n", t]);
      else if (KW.has(t)) out.push(["k", t]);
      else if (/^[A-Z]/.test(t)) out.push(["t", t]);
      else if (src[TNG.lastIndex] === "(") out.push(["f", t]);
      else out.push([null, t]);
      last = TNG.lastIndex;
    }
    if (last < src.length) out.push([null, src.slice(last)]);
    return out;
  }
  const HTML = /(<!--[\s\S]*?-->)|(<\/?[a-zA-Z][\w-]*)|([\w\-:@[\]()]+)(?==)|("[^"]*")|(\/?>)/g;
  function html(src) {
    const out = [];
    let last = 0, m;
    HTML.lastIndex = 0;
    while ((m = HTML.exec(src))) {
      if (m.index > last) out.push([null, src.slice(last, m.index)]);
      out.push([m[1] ? "c" : m[2] ? "k" : m[3] ? "f" : m[4] ? "s" : "k", m[0]]);
      last = HTML.lastIndex;
    }
    if (last < src.length) out.push([null, src.slice(last)]);
    return out;
  }
  const BASH = /(#[^\n]*)|("[^"]*")|(^|\n)(\s*)([\w-]+)/g;
  function bash(src) {
    const out = [];
    let last = 0, m;
    BASH.lastIndex = 0;
    while ((m = BASH.exec(src))) {
      if (m.index > last) out.push([null, src.slice(last, m.index)]);
      if (m[1]) out.push(["c", m[1]]);
      else if (m[2]) out.push(["s", m[2]]);
      else { out.push([null, m[3] + m[4]]); out.push(["f", m[5]]); }
      last = BASH.lastIndex;
    }
    if (last < src.length) out.push([null, src.slice(last)]);
    return out;
  }
  const CSS = /(\/\*[\s\S]*?\*\/)|(--[\w-]+)|(#[0-9a-fA-F]{3,8}\b|\d+(?:px|%|ms)?)|([.:][\w-]+)/g;
  function css(src) {
    const out = [];
    let last = 0, m;
    CSS.lastIndex = 0;
    while ((m = CSS.exec(src))) {
      if (m.index > last) out.push([null, src.slice(last, m.index)]);
      out.push([m[1] ? "c" : m[2] ? "b" : m[3] ? "n" : "k", m[0]]);
      last = CSS.lastIndex;
    }
    if (last < src.length) out.push([null, src.slice(last)]);
    return out;
  }
  function pintar(el, src, lenguaje) {
    const partes = (lenguaje === "html" ? html : lenguaje === "bash" ? bash : lenguaje === "css" ? css : tng)(String(src));
    const frag = document.createDocumentFragment();
    for (const [c, t] of partes) {
      if (!c) { frag.appendChild(document.createTextNode(t)); continue; }
      const s = document.createElement("span");
      s.className = "hl-" + c;
      s.textContent = t;
      frag.appendChild(s);
    }
    el.replaceChildren(frag);
  }

  // ---------- Ejemplos en vivo ----------
  let fuenteUI = null;
  function ui() {
    if (fuenteUI === null) {
      const s = document.querySelector('script[type="text/tangerine"][data-module$="ui.tng"]');
      fuenteUI = s ? s.textContent : "";
    }
    return fuenteUI;
  }
  function instancia(errores) {
    return new T({
      output: () => {},
      onError: (m) => errores.push(m),
      modules: { "tangerine-ui.tng": ui() },
      imports: { "tangerine-ui": "tangerine-ui.tng" },
    });
  }
  function mostrarError(el, msg) {
    const d = document.createElement("div");
    d.className = "demo-error";
    d.textContent = msg;
    el.replaceChildren(d);
  }
  function correrDemo(el, codigo) {
    el.replaceChildren();
    const errores = [];
    const t = instancia(errores);
    t.define("__destino", el);
    try { t.run(String(codigo) + "\nmount(__destino, Demo)"); }
    catch (x) { mostrarError(el, x.message || String(x)); return; }
    if (errores.length) mostrarError(el, errores[0]);
  }

  // Ordena el HTML con sangría para que se lea bien
  function ordenar(plano) {
    const tokens = plano.replace(/>\s*</g, ">\n<").split("\n");
    let nivel = 0;
    const lineas = [];
    const vacio = /^<(br|hr|img|input|meta|link)\b/;
    for (const t of tokens) {
      const cierra = /^<\//.test(t);
      if (cierra) nivel = Math.max(0, nivel - 1);
      lineas.push("  ".repeat(nivel) + t);
      const abre = /^<[a-z]/i.test(t) && !cierra && !vacio.test(t) && !/<\/[\w-]+>$/.test(t);
      if (abre) nivel++;
    }
    return lineas.join("\n");
  }

  const vistos = new IntersectionObserver((entradas) => {
    for (const e of entradas) {
      if (!e.isIntersecting) continue;
      vistos.unobserve(e.target);
      e.target.classList.add("visible");
      if (e.target.__alVer) { const f = e.target.__alVer; e.target.__alVer = null; f(); }
    }
  }, { rootMargin: "0px 0px -6% 0px" });

  T.registerPlugin({
    name: "sitio-ui",
    install(tng) {
      const invoke = (f, a) => tng.invoke(f, a || []);
      tng.defineAll({
        resaltar: (el, src, lenguaje) => { pintar(el, src, lenguaje); return el; },
        // Ejecuta el ejemplo y lo monta en el elemento
        demo: (el, codigo) => { correrDemo(el, codigo); return null; },
        // Igual, pero cuando el elemento aparece en pantalla
        demo_al_ver: (el, codigo) => { el.__alVer = () => correrDemo(el, codigo); vistos.observe(el); return null; },
        demo_html: (codigo) => {
          try { return ordenar(instancia([]).run(String(codigo) + "\nrender_html(Demo())")); }
          catch (x) { return "<!-- " + (x.message || x) + " -->"; }
        },
        revelar: (el) => { vistos.observe(el); return el; },
        tema_actual: () => raiz.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
        poner_tema: (t) => { raiz.dataset.theme = t; guardar("tui-tema", t); return null; },
        poner_acento: (hex) => { raiz.style.setProperty("--t-accent", hex); guardar("tui-acento", hex); return null; },
        acento_actual: () => leer("tui-acento") || "#f2761d",
        poner_radio: (px) => { aplicarRadio(px); guardar("tui-radio", String(px)); return null; },
        radio_actual: () => Number(leer("tui-radio") || 10),
        atajo_buscar: (f) => {
          document.addEventListener("keydown", (e) => {
            const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
            if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !enCampo)) {
              e.preventDefault();
              invoke(f);
            }
          });
          return null;
        },
        enfocar: (sel) => {
          setTimeout(() => { const e = document.querySelector(sel); if (e) e.focus(); }, 40);
          return null;
        },
      });
    },
  });
})();
</script>
<script type="text/tangerine" data-module="src/docs.tng">
// Documentación de cada componente. El código de cada ejemplo es real:
// la web lo ejecuta para dibujar la vista previa y lo convierte en HTML.

export let grupos = ["Formularios", "Contenedores", "Feedback", "Datos", "Layout"]

export let docs = [
  {
    id: "button",
    nombre: "Button",
    grupo: "Formularios",
    desc: "Un botón con variantes, tamaños, ícono y estado de carga. La acción va como segundo argumento.",
    ejemplos: [
      {
        titulo: "Variantes",
        codigo: 'import { Button, Row } from "tangerine-ui"

struct Demo {
  view {
    Row(8) {
      Button("Primario", || nil)
      Button("Secundario", || nil, .secondary)
      Button("Contorno", || nil, .outline)
      Button("Fantasma", || nil, .ghost)
      Button("Peligro", || nil, .danger)
      Button("Enlace", || nil, .link)
    }
  }
}',
      },
      {
        titulo: "Carga, tamaños e íconos",
        codigo: 'import { Button, Row, toast, Toaster } from "tangerine-ui"

struct Demo {
  @State var guardando = false

  async fn guardar() {
    guardando = true
    await sleep(1200)
    guardando = false
    toast("Cambios guardados", "success")
  }

  view {
    Row(8) {
      Button("Guardar", || guardar()).loading(guardando).icon("✓")
      Button("Pequeño", || nil, .secondary).size("sm")
      Button("Grande", || nil, .outline).size("lg")
      Button("Desactivado", || nil).disabled()
    }
    Toaster()
  }
}',
      },
    ],
    api: [
      ['Button(texto, accion?, variante?)', 'variante: .primary (por defecto), .secondary, .outline, .ghost, .danger, .link'],

<script type="text/tangerine" data-module="src/ui.tng">
// Tangerine UI: componentes listos para usar en Tangerine.
//
//   import { Button, Input, Card, Modal, toast, Toaster } from "tangerine-ui"
//
// Todos usan las clases de css/tangerine-ui.css. Los que reciben un bloque { }
// (Card, Alert, Modal, Stack, Row, Grid) lo muestran como contenido.

// ---------- Utilidades ----------

fn clases(lista) { lista.filter(|c| c != nil && c != "").join(" ") }
fn si(cond, valor) { if cond { valor } else { nil } }

var siguiente_id = 0
fn nuevo_id(prefijo) {
  siguiente_id += 1
  "{prefijo}-{siguiente_id}"
}

// ---------- Botón ----------

// Button("Guardar", || guardar())                variante: .primary (por defecto), .secondary,
// Button("Borrar", || borrar(), .danger)          .outline, .ghost, .danger, .link
// Button("Enviar").size("lg").loading(true).full().icon("→")
export struct Button {
  var texto = ""
  var accion = nil
  var variante = "primary"
  var tam = "md"
  var desactivado = false
  var cargando = false
  var icono = nil
  var ancho = false
  var tipo = "button"

  init(t, a = nil, v = "primary") {
    texto = t
    accion = a
    variante = v
  }

  fn size(s) { tam = s; self }
  fn disabled(b = true) { desactivado = b; self }
  fn loading(b = true) { cargando = b; self }
  fn icon(i) { icono = i; self }
  fn full() { ancho = true; self }
  fn submit() { tipo = "submit"; self }

  fn pulsar() {
    if accion != nil && !desactivado && !cargando { accion() }
  }

  view {
    element("button", {
      class: clases(["t-btn", "t-btn-{variante}", si(tam != "md", "t-btn-{tam}"), si(ancho, "t-btn-full"), si(cargando, "is-loading")]),
      type: tipo,
      disabled: desactivado,
      "aria-busy": si(cargando, "true"),
      on_click: || pulsar(),
    }) {
      if icono != nil { span(.t-btn-icon, { "aria-hidden": "true" }) { icono } }
      span { texto }
    }
  }
}

// ---------- Campos de formulario ----------

// Input("Correo", $correo, "email").placeholder("tu@correo.com").hint("No lo compartimos")
// .error("Falta el @") lo marca en rojo. El segundo argumento siempre es un $campo.
export struct Input {
  var etiqueta = nil
  var valor = nil
  var tipo = "text"
  var marcador = nil
  var ayuda = nil
  var fallo = nil
  var desactivado = false
  var id = ""

  init(e, v, t = "text") {
    etiqueta = e
    valor = v
    tipo = t
    id = nuevo_id("t-input")
  }

  fn placeholder(p) { marcador = p; self }
  fn hint(h) { ayuda = h; self }
  fn error(e) { fallo = e; self }
  fn disabled(b = true) { desactivado = b; self }

  view {
    div({ class: clases(["t-field", si(fallo != nil, "has-error")]) }) {
      if etiqueta != nil { label(.t-label, { for: id }) { etiqueta } }
      input(.t-input, valor, {
        id: id,
        type: tipo,
        placeholder: marcador,
        disabled: desactivado,
        "aria-invalid": si(fallo != nil, "true"),
        "aria-describedby": si(fallo != nil || ayuda != nil, "{id}-msg"),
      })
      if fallo != nil {
        p(.t-field-error, { id: "{id}-msg" }) { fallo }
      } else if ayuda != nil {
        p(.t-field-hint, { id: "{id}-msg" }) { ayuda }
      }
    }
  }
}

// Textarea("Mensaje", $mensaje).rows(5).placeholder("Escribe aquí")
export struct Textarea {
  var etiqueta = nil
  var valor = nil
  var filas = 4
  var marcador = nil
  var ayuda = nil
  var fallo = nil
  var id = ""

  init(e, v) {
    etiqueta = e
    valor = v
    id = nuevo_id("t-textarea")
  }

  fn rows(n) { filas = n; self }
  fn placeholder(p) { marcador = p; self }
  fn hint(h) { ayuda = h; self }
  fn error(e) { fallo = e; self }

  view {
    div({ class: clases(["t-field", si(fallo != nil, "has-error")]) }) {
      if etiqueta != nil { label(.t-label, { for: id }) { etiqueta } }
      textarea(.t-textarea, valor, { id: id, rows: filas, placeholder: marcador, "aria-invalid": si(fallo != nil, "true") })
      if fallo != nil {
        p(.t-field-error) { fallo }
      } else if ayuda != nil {
        p(.t-field-hint) { ayuda }
      }
    }
  }
}

// Select("País", $pais, ["Colombia", "México"])
// Cada opción puede ser un texto o un par [valor, texto]: [["co", "Colombia"], ["mx", "México"]]
export struct Select {
  var etiqueta = nil
  var valor = nil
  var opciones = []
  var ayuda = nil
  var id = ""

  init(e, v, o) {
    etiqueta = e
    valor = v
    opciones = o
    id = nuevo_id("t-select")
  }

  fn hint(h) { ayuda = h; self }

  view {
    div(.t-field) {
      if etiqueta != nil { label(.t-label, { for: id }) { etiqueta } }
      select(.t-select, valor, { id: id }) {
        for o in opciones {
          if type_of(o) == "List" {
            option({ value: o[0] }) { o[1] }
          } else {
            option({ value: o }) { o }
          }
        }
      }
      if ayuda != nil { p(.t-field-hint) { ayuda } }
    }
  }
}

// Checkbox("Acepto los términos", $acepto)
export struct Checkbox {
  var texto = ""
  var valor = nil
  var desactivado = false

  init(t, v) {
    texto = t
    valor = v
  }

  fn disabled(b = true) { desactivado = b; self }

  view {
    label({ class: clases(["t-check", si(desactivado, "is-disabled")]) }) {
      input(valor, { type: "checkbox", class: "t-check-input", disabled: desactivado })
      span(.t-check-box, { "aria-hidden": "true" })
      span { texto }
    }
  }
}

// Switch("Notificaciones", $avisos)
export struct Switch {
  var texto = ""
  var valor = nil
  var desactivado = false

  init(t, v) {
    texto = t
    valor = v
  }

  fn disabled(b = true) { desactivado = b; self }

  view {
    label({ class: clases(["t-switch", si(desactivado, "is-disabled")]) }) {
      input(valor, { type: "checkbox", role: "switch", class: "t-switch-input", disabled: desactivado })
      span(.t-switch-track, { "aria-hidden": "true" }) { span(.t-switch-thumb) }
      span { texto }
    }

export struct RadioGroup {

  var valor = nil
  var opciones = []
  var nombre = ""

  init(e, v, o) {
    etiqueta = e
    valor = v
    opciones = o

  }

  view {
    fieldset(.t-radio-group) {
      if etiqueta != nil { legend(.t-label) { etiqueta } }
      for o in opciones {
        let clave = if type_of(o) == "List" { o[0] } else { o }
        let texto = if type_of(o) == "List" { o[1] } else { o }
        label(.t-radio) {
          input({ type: "radio", class: "t-radio-input", name: nombre, value: clave, checked: valor.get() == clave, on_change: || valor.set(clave) })

          span { texto }
        }
      }
    }
  }
}

// Card("Perfil", "Tus datos públicos") { ...contenido... }
// .variant("elevated" | "outline" | "accent")  .interactive() la levanta al pasar el mouse
export struct Card {
  var titulo = nil
  var subtitulo = nil
  var variante = "default"
  var interactiva = false

  init(t = nil, s = nil) {
    titulo = t
    subtitulo = s
  }

  fn variant(v) { variante = v; self }
  fn interactive() { interactiva = true; self }

  view {
    section({ class: clases(["t-card", si(variante != "default", "t-card-{variante}"), si(interactiva, "is-interactive")]) }) {
      if titulo != nil {
        header(.t-card-head) {
          h3(.t-card-title) { titulo }
          if subtitulo != nil { p(.t-card-sub) { subtitulo } }
        }

    }
  }
}

// Alert("Se guardaron los cambios", .success)   tipos: .info, .success, .warning, .danger
// Alert("No se pudo conectar", .danger).title("Error")
export struct Alert {
  var texto = nil
  var tipo = "info"
  var titulo = nil

  init(t = nil, k = "info") {
    texto = t
    tipo = k
  }

  fn title(t) { titulo = t; self }

  view {
    div({ class: "t-alert t-alert-{tipo}", role: if tipo == "danger" { "alert" } else { "status" } }) {
      if titulo != nil { div(.t-alert-title) { titulo } }
      div(.t-alert-body) {
        if texto != nil { texto }
        children
      }
    }
  }
}

// Modal($abierto, "Título") { ...contenido... }   .size("sm" | "lg")
// Se cierra con la X, con Escape o al hacer clic afuera.
export struct Modal {
  var abierto = nil
  var titulo = nil
  var tam = "md"

  init(a, t = nil) {
    abierto = a
    titulo = t
  }

  fn size(s) { tam = s; self }
  fn cerrar() { abierto.set(false) }

  view {
    if abierto.get() {
      div({ class: clases(["t-modal", si(tam != "md", "t-modal-{tam}")]) }) {
        div(.t-modal-backdrop, { on_click: || cerrar() })
        div(.t-modal-panel, {
          role: "dialog",
          "aria-modal": "true",
          "aria-label": titulo,
          tabindex: "-1",
          ref: |el| focus(el),
          on_keydown: |e| { if e.key == "Escape" { cerrar() } },
        }) {
          div(.t-modal-head) {
            if titulo != nil { h2(.t-modal-title) { titulo } }
            element("button", { class: "t-modal-close", "aria-label": "Cerrar", on_click: || cerrar() }) { "×" }
          }
          div(.t-modal-body) { children }
        }
      }
    }
  }
}

// Tabs($pestana, ["Perfil", "Cuenta", "Avisos"])  $pestana guarda el índice: 0, 1, 2...
// .line() las muestra subrayadas
export struct Tabs {
  var valor = nil
  var pestanas = []
  var estilo = "pill"

  init(v, p) {
    valor = v
    pestanas = p
  }

  fn line() { estilo = "line"; self }

  view {
    div({ class: clases(["t-tabs", si(estilo == "line", "t-tabs-line")]), role: "tablist" }) {
      for (i, p) in pestanas.enumerate() {
        element("button", {
          class: clases(["t-tab", si(valor.get() == i, "is-active")]),
          role: "tab",
          "aria-selected": if valor.get() == i { "true" } else { "false" },
          on_click: || valor.set(i),
        }) { p }
      }
    }
  }
}

// Table([["nombre", "Nombre"], ["rol", "Rol"]], usuarios)
// Cada columna es [clave, título] o solo la clave. Cada fila es un mapa.
export struct Table {
  var columnas = []
  var filas = []
  var vacio = "Sin datos"

  init(c, f) {
    columnas = c.map(|x| if type_of(x) == "List" { x } else { [x, x] })
    filas = f
  }

  fn empty(t) { vacio = t; self }

  view {
    div(.t-table-wrap) {
      table(.t-table) {
        thead { tr { for c in columnas { th { c[1] } } } }
        tbody {
          if filas.len() == 0 {
            tr { td(.t-table-empty, { colspan: columnas.len() }) { vacio } }
          }
          for f in filas {
            tr { for c in columnas { td { f[c[0]] ?? "" } } }
          }
        }
      }
    }
  }
}

// Badge("Nuevo", .accent)   tipos: .neutral, .accent, .success, .warning, .danger, .info
// .dot() le pone un punto; .live() lo hace latir
export struct Badge {
  var texto = ""
  var tipo = "neutral"
  var punto = false
  var vivo = false

  init(t, k = "neutral") {
    texto = t
    tipo = k
  }

  fn dot() { punto = true; self }
  fn live() { punto = true; vivo = true; self }

  view {
    span({ class: clases(["t-badge", si(tipo != "neutral", "t-badge-{tipo}"), si(punto, "t-badge-dot"), si(vivo, "is-live")]) }) { texto }
  }
}

// Avatar("Ana Pérez")  muestra AP;  Avatar("Ana", "foto.jpg") usa la imagen.  .size("sm" | "lg")
export struct Avatar {
  var nombre = ""
  var imagen = nil
  var tam = "md"

  init(n, i = nil) {
    nombre = n
    imagen = i
  }

  fn size(s) { tam = s; self }

  }

  view {
    span({ class: clases(["t-avatar", si(tam != "md", "t-avatar-{tam}")]), title: nombre, role: "img", "aria-label": nombre }) {
      if imagen != nil { img({ src: imagen, alt: "" }) } else { iniciales() }
    }
  }
}

// Spinner()  Spinner("sm")  Spinner("lg")
export struct Spinner {
  var tam = "md"
  init(t = "md") { tam = t }
  view {
    span({ class: clases(["t-spinner", si(tam != "md", "t-spinner-{tam}")]), role: "status", "aria-label": "Cargando" })
  }
}

// Skeleton("100%", "14px")  .circle() para fotos de perfil
export struct Skeleton {
  var ancho = "100%"
  var alto = "1em"
  var circulo = false

  init(a = "100%", h = "1em") {
    ancho = a
    alto = h
  }

  fn circle() { circulo = true; self }

  view {
    span({ class: clases(["t-skeleton", si(circulo, "t-skeleton-circle")]), style: "width: {ancho}; height: {alto}", "aria-hidden": "true" })
  }
}

// Progress(60)  Progress(3, 10).label("Subiendo archivos")
export struct Progress {
  var valor = 0
  var maximo = 100
  var etiqueta = nil

  init(v, m = 100) {
    valor = v
    maximo = m
  }

  fn label(t) { etiqueta = t; self }

  view {
    let pct = (valor / maximo * 100).clamp(0, 100).round(0)
    div(.t-progress) {
      if etiqueta != nil {
        div(.t-progress-head) {
          span { etiqueta }
          span { "{pct}%" }
        }
      }

        div(.t-progress-bar, { style: "width: {pct}%" })
      }
    }
  }
}

// Kbd("Ctrl")
export struct Kbd {
  var texto = ""
  init(t) { texto = t }
  view { element("kbd", { class: "t-kbd" }) { texto } }
}

// Divider()  Divider("o")
export struct Divider {

  view {

  }
}

// Stack(12) { ... }  apila en columna con 12px entre cada cosa
export struct Stack {
  var espacio = 16
  init(g = 16) { espacio = g }
  view { div(.t-stack, { style: "--t-gap: {espacio}px" }) { children } }
}

// Row(8) { ... }  en fila, y salta de línea si no cabe
export struct Row {
  var espacio = 12
  var alinear = "center"
  init(g = 12, a = "center") {
    espacio = g
    alinear = a
  }
  view { div(.t-row, { style: "--t-gap: {espacio}px; --t-align: {alinear}" }) { children } }
}

// Grid(3, 16) { ... }  rejilla de 3 columnas; en el móvil, una sola
export struct Grid {
  var columnas = 3
  var espacio = 16
  init(c = 3, g = 16) {
    columnas = c
    espacio = g
  }
  view { div(.t-grid, { style: "--t-cols: {columnas}; --t-gap: {espacio}px" }) { children } }
}

// ---------- Avisos (toasts) ----------

// Pon Toaster() una vez en tu app y llama a toast("Guardado", "success") desde donde quieras.
let avisos = state([])
var siguiente_aviso = 0

export fn toast(texto, tipo = "neutral", ms = 3200) {
  siguiente_aviso += 1
  let id = siguiente_aviso
  avisos.update(|l| l + [{ id, texto, tipo }])
  after(ms, || avisos.update(|l| l.filter(|a| a.id != id)))
  nil
}

export struct Toaster {
  view {
    div(.t-toaster, { "aria-live": "polite" }) {
      for a in avisos.get() {
        div({ key: a.id, class: clases(["t-toast", si(a.tipo != "neutral", "t-toast-{a.tipo}")]), role: "status" }) { a.texto }
      }
    }
  }
}

@Component("ui-ejemplo")
struct Ejemplo {
  @Input var codigo = ""
  @State var vista = 0
  @State var editando = false
  @State var borrador = nil
  @State var version = 0
  var pendiente = 0

  fn actual() { borrador ?? codigo }
  fn visible() { if vista == 0 { actual() } else { demo_html(actual()) } }

  fn editar() {
    if !editando {
      borrador = actual()
      vista = 0
    }
    editando = !editando
  }

  fn restablecer() {
    borrador = nil
    editando = false
    version += 1
  }

  // Vuelve a ejecutar el ejemplo cuando dejas de escribir
  fn programar() {
    pendiente += 1
    let mio = pendiente
    after(420, || { if mio == pendiente { version += 1 } })
  }

  view {
    div(.ej) {
      div(.ej-preview) {
        div(.ej-lienzo, { key: "v{version}", raw: true, ref: |el| demo_al_ver(el, actual()) })
      }

        div(.ej-bar) {
          div(.ej-tabs, { role: "tablist" }) {
            for (i, n) in ["Tangerine", "HTML"].enumerate() {
              element("button", { class: clases(["ej-tab", si(vista == i, "on")]), role: "tab", "aria-selected": if vista == i { "true" } else { "false" }, on_click: || { vista = i; editando = false } }) { n }
            }
          }
          div(.ej-acciones) {
            if borrador != nil && borrador != codigo {
              element("button", { class: "ej-btn", on_click: || restablecer() }) { "Restablecer" }
            }
            element("button", { class: clases(["ej-btn", si(editando, "on")]), on_click: || editar() }) { if editando { "Listo" } else { "Editar" } }
            element("button", { class: "ej-btn", on_click: |e| copy(visible(), e.target) }) { "Copiar" }
          }
        }
        if editando {
          textarea(.ej-editor, $borrador, { spellcheck: "false", "aria-label": "Código del ejemplo", on_input: || programar() })
        } else {
          pre(.ej-pre, { key: "{vista}-{version}", raw: true, ref: |el| resaltar(el, visible(), if vista == 0 { "tng" } else { "html" }) })
        }
      }
    }
  }
}

let COLORES = [
  ["Mandarina", "#f2761d"], ["Fresa", "#e5484d"], ["Frambuesa", "#d6409f"], ["Uva", "#8e4ec6"],
  ["Arándano", "#3e63dd"], ["Menta", "#0894b3"], ["Lima", "#30a46c"], ["Grafito", "#52525b"],
]

fn css_tema(acento, radio) {
  ':root {' + "\n  --t-accent: {acento};\n  --t-radius: {radio}px;\n" + '}'
}

// ---------- App ----------

struct App {
  @State var ruta = ""
  @State var tema = "light"
  @State var acento = "#f2761d"
  @State var radio = 10
  @State var buscando = false
  @State var consulta = ""
  @State var menu = false
  @State var muestra = "Ana"
  @State var muestra_on = true

  fn on_mount() {
    tema = tema_actual()
    acento = acento_actual()
    radio = radio_actual()
    on_route(|h| {
      ruta = h
      menu = false
      buscando = false
      scroll_top()
    })
    atajo_buscar(|| abrir_busqueda())
  }

  fn abrir_busqueda() {
    consulta = ""
    buscando = true
    enfocar(".t-modal input")
  }

  fn alternar_tema() {
    tema = if tema == "dark" { "light" } else { "dark" }
    poner_tema(tema)
  }

  fn elegir_color(hex) {
    acento = hex
    poner_acento(hex)
  }

  fn cambiar_radio(v) {
    radio = v
    poner_radio(v)
  }

  fn doc_actual() { docs.find(|d| "c/{d.id}" == ruta) }

  fn resultados() {
    let q = consulta.lower().trim()
    if q == "" { docs } else { docs.filter(|d| d.nombre.lower().contains(q) || d.grupo.lower().contains(q) || d.desc.lower().contains(q)) }
  }

  view {
    header(.top) {
      div(.top-in) {
        if ruta != "" {
          element("button", { class: "icono menu-btn", "aria-label": "Menú", "aria-expanded": if menu { "true" } else { "false" }, on_click: || { menu = !menu } }) { "☰" }
        }
        a(.marca, { href: "#" }) {
          img({ src: "logo.svg", alt: "", width: 28, height: 28 })
          span(.marca-t) { "Tangerine" }
          span(.marca-ui) { "UI" }
        }
        nav(.top-nav, { "aria-label": "Secciones" }) {
          a({ href: "#c/button", class: si(ruta.starts_with("c/"), "on") }) { "Componentes" }
          a({ href: "#temas", class: si(ruta == "temas", "on") }) { "Temas" }
          a({ href: "#instalar", class: si(ruta == "instalar", "on") }) { "Instalar" }
        }
        div(.top-acc) {
          element("button", { class: "buscar", on_click: || abrir_busqueda() }) {
            span(.buscar-ico, { "aria-hidden": "true" })
            span(.buscar-txt) { "Buscar" }
            span(.buscar-kbd) { Kbd("Ctrl"); Kbd("K") }
          }
          element("button", { class: "icono", "aria-label": "Cambiar a modo claro u oscuro", on_click: || alternar_tema() }) {
            span({ class: "tema-ico {tema}", "aria-hidden": "true" })
          }
          a({ href: REPO, class: "icono gh", "aria-label": "Tangerine UI en GitHub" })
        }
      }
    }

    if ruta == "" {
      main(.portada, { key: "inicio" }) { Inicio() }
    } else {
      div(.docs, .ancho) {
        aside({ class: clases(["lateral", si(menu, "abierto")]) }) {
          p(.lat-grupo) { "Empezar" }
          a({ href: "#instalar", class: clases(["lat-link", si(ruta == "instalar", "on")]) }) { "Instalación" }
          a({ href: "#temas", class: clases(["lat-link", si(ruta == "temas", "on")]) }) { "Temas" }
          for g in grupos {
            p(.lat-grupo) { g }
            for d in docs.filter(|d| d.grupo == g) {
              a({ href: "#c/{d.id}", class: clases(["lat-link", si(ruta == "c/{d.id}", "on")]) }) { d.nombre }
            }
          }
        }
        main(.pagina, { key: ruta }) {
          if ruta == "instalar" {
            Instalar()
          } else if ruta == "temas" {
            div(.pag-cab) {
              p(.miga) { "Empezar" }
              h1 { "Temas" }
              p(.pag-desc) { "Todo sale de variables CSS. Elige un color y un radio: la web entera cambia, y abajo tienes el CSS para copiar." }
            }
            h2(.pag-h2) { "Color principal" }
            div(.colores) {
              for c in COLORES {
                element("button", {
                  class: clases(["color", si(acento == c[1], "on")]),
                  style: "--c: {c[1]}",
                  "aria-pressed": if acento == c[1] { "true" } else { "false" },
                  on_click: || elegir_color(c[1]),
                }) { span(.color-punto); span { c[0] } }
              }
            }
            h2(.pag-h2) { "Esquinas: {radio}px" }
            input(.rango, { type: "range", min: 0, max: 20, value: radio, "aria-label": "Radio de las esquinas", on_input: |e| cambiar_radio(e.value.parse()) })
            h2(.pag-h2) { "Vista previa" }
            Grid(2, 14) {
              Card("Formulario") {
                Input("Nombre", $muestra)
                Switch("Activado", $muestra_on)
                Row(8) {
                  Button("Guardar", || toast("Guardado", "accent"))
                  Button("Cancelar", || nil, .outline)
                }
              }
              Card("Estado") {
                Row(8) { Badge("Nuevo", .accent); Badge("Activo", .success).dot(); Badge("Beta", .info) }
                Progress(62).label("Progreso")
                Alert("Así se ven las alertas.", .info)
              }
            }
            h2(.pag-h2) { "Tu CSS" }
            Codigo(css_tema(acento, radio), "css", "Pégalo después de tangerine-ui.css")
          } else if doc_actual() != nil {
            let d = doc_actual()
            let i = docs.position(|x| x.id == d.id)
            div(.pag-cab) {
              p(.miga) { "Componentes · {d.grupo}" }
              h1 { d.nombre }
              p(.pag-desc) { d.desc }
            }
            for (n, e) in d.ejemplos.enumerate() {
              h2(.pag-h2) { e.titulo }
              element("ui-ejemplo", { key: "{d.id}-{n}", codigo: e.codigo })
            }
            h2(.pag-h2) { "API" }
            div(.api) {
              for fila in d.api {
                div(.api-fila) {
                  code(.api-firma) { fila[0] }
                  p(.api-desc) { fila[1] }
                }
              }
            }
            nav(.pag-nav) {
              if i > 0 {
                a({ href: "#c/{docs[i - 1].id}", class: "pag-ant" }) { span { "Anterior" }; strong { "← {docs[i - 1].nombre}" } }
              } else {
                span({ class: "hueco" })
              }
              if i < docs.len() - 1 {
                a({ href: "#c/{docs[i + 1].id}", class: "pag-sig" }) { span { "Siguiente" }; strong { "{docs[i + 1].nombre} →" } }
              }
            }
          } else {
            div(.pag-cab) {
              h1 { "No encontramos esa página" }
              p(.pag-desc) { "Puede que el enlace esté mal escrito." }
              a({ href: "#", class: "t-btn t-btn-primary" }) { "Volver al inicio" }
            }
          }
        }
      }
    }

    footer(.pie, .ancho) {
      span { "Tangerine UI · MIT" }
      span {
        "Hecho con "
        a({ href: "https://manuelosmadev.github.io/tangerine-lang/" }) { "Tangerine" }
      }
    }

    Modal($buscando, "Buscar componentes") {
      Input(nil, $consulta, "search").placeholder("Button, Modal, tabla...")
      div(.resultados) {
        for d in resultados() {
          a({ href: "#c/{d.id}", class: "resultado", key: d.id }) {
            span(.resultado-nombre) { d.nombre }
            span(.resultado-grupo) { d.grupo }
          }
        }
        if resultados().len() == 0 { p(.resultado-vacio) { "Nada con “{consulta}”" } }
      }
    }
    Toaster()
  }
}

mount("#app", App)
</script>

</body>
</html>
